# docker compose up -d   ·   first start: docker compose exec owni cat /data/owner-login-link.txt
services:
  owni:
    build: .
    image: owni:local
    restart: unless-stopped
    env_file: .env
    environment:
      OWNI_DATA_DIR: /data
      OWNI_WEB_HOST: 0.0.0.0
      OWNI_WEB_PORT: "8080"
    volumes:
      - owni-data:/data
    # Only on this machine: put a reverse proxy with https in front (see docs/runbook.md).
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 30s
    # Least privilege: writes only to /data and /tmp, no Linux capabilities, no setuid escalation.
    # Tools proposti run in a child process of this container and inherit these limits.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The instances' computers (ADR 0013, docs/runbook.md 6j): uncomment on a server where Owni is
    # the only service. The socket is root on this machine. OWNI_COMPUTER=docker goes in .env, and
    # DOCKER_GID is the socket's group: stat -c %g /var/run/docker.sock
    # volumes:
    #   - owni-data:/data
    #   - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"

volumes:
  owni-data:
