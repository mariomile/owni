[package]
name = "owni-desktop"
version = "0.12.3"
description = "Owni as a desktop app: a window on an Owni server"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix keeps the library name apart from the binary's (a Windows linker clash).
name = "owni_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.12.0"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
