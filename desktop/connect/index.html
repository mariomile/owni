<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Owni</title>
		<link rel="stylesheet" href="connect.css" />
		<script type="module" src="connect.js"></script>
	</head>
	<body>
		<div class="titlebar" data-tauri-drag-region></div>
		<main id="avvio" role="status" hidden>
			<svg class="mark" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true"><rect width="64" height="64" rx="14.3"/><g class="eyes"><ellipse cx="23.5" cy="32" rx="4.6" ry="7.4"/><ellipse cx="40.5" cy="32" rx="4.6" ry="7.4"/></g></svg>
			<h1 class="visually-hidden">Owni si sta accendendo</h1>
		</main>
		<main id="collega" hidden>
			<img src="icon.svg" alt="" width="48" height="48" />
			<h1>Collega Owni</h1>
			<p>Scrivi l'indirizzo del tuo Owni, oppure incolla il tuo link personale per entrare subito.</p>
			<form>
				<label for="server">Indirizzo o link personale</label>
				<input id="server" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="owni.tuaazienda.it" required />
				<p id="error" role="alert" hidden></p>
				<button type="submit">Collega</button>
				<button type="button" class="ghost" id="locale" hidden>Usa Owni su questo computer</button>
			</form>
			<p class="muted">Su Owni Cloud l'indirizzo è nella mail di benvenuto. Lo cambi quando vuoi dall'icona di Owni nella barra.</p>
		</main>
	</body>
</html>
