name: CI
on:
  push:
    branches: [main]
    # Text only: nothing for the checks to run on (Actions minutes are counted).
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version read from packageManager (pnpm@10.17.1)
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Browser-side JS syntax (console, OpenUI frame, cloud UI, desktop connect)
        run: sh scripts/check-js.sh
      # The browser tests run on real Chromium and WebKit (OpenUI), found through PLAYWRIGHT_BROWSERS_PATH.
      - name: Chromium and WebKit for the browser tests
        run: pnpm exec playwright-core install --with-deps chromium webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      # OWNI_REQUIRE_BROWSERS=1: a browser that does not start fails the run instead of skipping its suites.
      - run: pnpm test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
          OWNI_REQUIRE_BROWSERS: "1"
      - name: General agent catalog + deterministic outcome contracts (faux, no external calls)
        run: pnpm eval:agente
