name: Evals nightly
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deterministic evals
        run: pnpm eval:segreteria && pnpm eval:agente
      - name: Real models + LLM judge (skipped without OWNI_JUDGE_MODEL_KEY, an Anthropic key)
        run: pnpm eval:segreteria:judge
        env:
          OWNI_JUDGE_MODEL_KEY: ${{ secrets.OWNI_JUDGE_MODEL_KEY }}
      - name: General agent with the real model (skipped without OWNI_JUDGE_MODEL_KEY)
        # Runs also when the segreteria judge failed: the two measure different things.
        if: success() || failure()
        run: pnpm eval:agente:real
        env:
          OWNI_JUDGE_MODEL_KEY: ${{ secrets.OWNI_JUDGE_MODEL_KEY }}
      - name: Agent routing and outcome summary (passed, failed, skipped, error)
        if: always()
        run: |
          missing=0
          for report in agente outcomes; do
            if [ -f "evals/agente/last-report/$report.md" ] && [ -f "evals/agente/last-report/$report.json" ]; then
              cat "evals/agente/last-report/$report.md" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Missing agent eval report: $report"
              echo "Agent eval $report: error (missing report, not skipped)." >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          exit "$missing"
      - name: Upload judge report
        if: always()
        # A full artifact quota must not turn the evals red: the report is a convenience.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: segreteria-judge-report
          path: evals/segreteria/last-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload agent report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agente-report
          path: evals/agente/last-report/
          if-no-files-found: error
          retention-days: 14
