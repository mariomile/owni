name: Desktop app
# Installers for macOS, Windows and Linux, in a draft release. By hand, or with a desktop-v* tag.
# Unsigned until the signing secrets exist (docs/desktop.md, «Firma»).
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Mac app carries Owni's own server (docs/desktop.md, «Owni sul Mac»).
          - platform: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.local.conf.json
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Owni's server for the Mac app
        if: matrix.platform == 'macos-latest'
        run: bash desktop/scripts/bundle-server.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles and latest.json, which the installed apps check (docs/desktop.md, «Aggiornamenti»).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Owni desktop __VERSION__
          releaseDraft: true
